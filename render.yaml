# Deploy no Render (New > Blueprint > este repositório). Plano grátis: dorme após 15 min sem acesso
# e o H2 em memória volta aos dados mockados sempre que o serviço reinicia.
services:
  - type: web
    name: sistema-de-gestao
    runtime: docker
    plan: free
    region: virginia
    healthCheckPath: /
    autoDeploy: true
